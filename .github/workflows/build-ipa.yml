name: Build iOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-13
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies & Prepare Web Files
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/ios
          
          # إنشاء مجلد www ونقل ملفات الويب إليه
          mkdir -p www
          cp -r *.html *.css *.js *.json www/ 2>/dev/null || true
          
          # تنفيذ المزامنة وإنشاء مشروع iOS
          npx cap add ios || true
          npx cap sync ios

      - name: Build Xcode Project
        run: |
          cd ios/App
          xcodebuild build \
            -workspace App.xcworkspace \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Create Payload & Zip IPA
        run: |
          cd ios/App/build/Build/Products/Release-iphoneos
          mkdir Payload
          mv App.app Payload/
          zip -r MyBudget.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v3
        with:
          name: MyBudget-IPA
          path: ios/App/build/Build/Products/Release-iphoneos/MyBudget.ipa
