name: Build iOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies & Prepare Web Files
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/ios
          mkdir -p www
          cp -r *.html *.css *.js *.json www/ 2>/dev/null || true
          npx cap add ios || true

          # رفع إصدار iOS المستهدف ليتوافق مع Capacitor 6+
          if [ -f ios/App/Podfile ]; then
            sed -i '' "s/platform :ios, '.*'/platform :ios, '13.0'/g" ios/App/Podfile
          fi

          npx cap sync ios

      - name: Build Xcode Project
        run: |
          cd ios/App
          xcodebuild build \
            -workspace App.xcworkspace \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Create Payload & Zip IPA
        run: |
          cd ios/App/build/Build/Products/Release-iphoneos
          mkdir Payload
          mv App.app Payload/
          zip -r MyBudget.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyBudget-IPA
          path: ios/App/build/Build/Products/Release-iphoneos/MyBudget.ipa
